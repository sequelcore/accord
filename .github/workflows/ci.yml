name: CI

# Linux runs on every pull request, in the merge queue and on main; it is the
# required check. Windows and macOS run when a pull request gets the `full-ci`
# label, or by hand: once before merging, rather than on every push.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'platforms' || 'linux' }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install the pinned solvers
        shell: bash
        run: scripts/install-solvers.sh "$RUNNER_TEMP/solvers"
      - run: cargo test --workspace --locked

  platforms:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install the pinned solvers
        shell: bash
        run: scripts/install-solvers.sh "$RUNNER_TEMP/solvers"
      - run: cargo test --workspace --locked
